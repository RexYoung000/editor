name: 功能与体验改进
description: 面向老师或开发流程的新增能力与体验变化
title: "[功能] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 为什么要做
      description: 说明当前事实、目标用户和实际影响，不直接用技术方案代替问题。
      placeholder: 老师在什么场景遇到什么问题，这会造成什么影响？
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 描述完成后用户可以做到什么、看到什么。
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 范围与非目标
      description: 分别写清本次包含和明确不包含的内容，避免实施过程中失控扩展。
      placeholder: |
        包含：
        -

        不包含：
        -
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收方式
      description: 使用可操作、可观察的结果描述正常场景和关键异常场景。
      placeholder: |
        1. 从哪里进入
        2. 执行什么操作
        3. 应看到什么结果
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: 所属阶段
      options:
        - 通用基础与协作环境
        - 阶段一：交互与层级管理
        - 阶段二：组件归类与信息管理
        - 阶段三：组合预设模板
        - 阶段四：持续体验优化
    validations:
      required: true

  - type: textarea
    id: dependency
    attributes:
      label: 依赖、风险与待确认事项
      description: 没有可填写“无”。存在实质未决问题时，Issue 对齐后再开始开发。
    validations:
      required: true
