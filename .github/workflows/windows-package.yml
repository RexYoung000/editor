name: Windows 安装包

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 要打包的 Git Tag
        required: true
        default: v1.1.0

permissions:
  contents: write

jobs:
  package:
    name: 构建 Windows NSIS 安装包
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 检出指定 Tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 Windows 安装包
        run: pnpm exec electron-builder --win --x64 --publish never

      - name: 输出安装包校验值
        shell: pwsh
        run: |
          $installer = Get-ChildItem "release" -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $installer) {
            throw "未找到 Windows 安装包"
          }
          $hash = Get-FileHash $installer.FullName -Algorithm SHA256
          Write-Host "安装包: $($installer.FullName)"
          Write-Host "SHA-256: $($hash.Hash)"

      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: forge-windows-installer-${{ inputs.tag }}
          path: release/**/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: 上传安装包到 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem "release" -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $installer) {
            throw "未找到 Windows 安装包"
          }
          gh release upload "${{ inputs.tag }}" "$($installer.FullName)" --clobber
