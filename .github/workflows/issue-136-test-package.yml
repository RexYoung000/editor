name: Issue 136 Windows 测试安装包

on:
  push:
    branches:
      - feat/136-course-publish-flow

permissions:
  contents: read

jobs:
  package:
    name: 构建独立测试客户端
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TEST_VERSION: 1.4.1-test.136.4

    steps:
      - name: 检出当前提交
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 验证发布流程与内置 SVN CLI
        shell: pwsh
        run: |
          pnpm lint
          pnpm test
          pnpm build
          $svn = "electron/vendor/svn-cli/windows-x64/bin/svn.exe"
          if (-not (Test-Path $svn)) {
            throw "未找到内置 SVN CLI"
          }
          $version = & $svn --version --quiet
          if ($LASTEXITCODE -ne 0 -or $version -ne "1.14.5") {
            throw "内置 SVN CLI 无法运行或版本不正确: $version"
          }
          Write-Host "内置 SVN CLI: $version"

      - name: 写入独立测试版标识
        shell: pwsh
        run: |
          @'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.name = 'forge-issue-136-test';
          pkg.productName = '豌豆课件编辑器测试版 #136';
          pkg.version = process.env.TEST_VERSION;
          pkg.build.appId = 'com.vipthink.forge.issue136.test';
          pkg.build.productName = 'wandouEditorIssue136Test';
          pkg.build.executableName = 'wandouEditorIssue136Test';
          pkg.build.directories.output = 'release/issue-136-test';
          pkg.build.nsis.shortcutName = '豌豆课件编辑器测试版 #136';
          pkg.build.nsis.artifactName = '豌豆课件编辑器测试版-136-Setup-${version}.${ext}';
          pkg.build.extraMetadata = {
            ...(pkg.build.extraMetadata || {}),
            name: pkg.name,
            productName: pkg.productName,
            version: pkg.version,
          };
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          '@ | node -

      - name: 构建 Windows NSIS 测试安装包
        run: pnpm exec electron-builder --win --x64 --publish never

      - name: 验证打包后的 SVN CLI
        shell: pwsh
        run: |
          $svn = "release/issue-136-test/win-unpacked/resources/svn-cli/bin/svn.exe"
          if (-not (Test-Path $svn)) {
            throw "Windows 应用资源中未找到 SVN CLI"
          }
          $version = & $svn --version --quiet
          if ($LASTEXITCODE -ne 0 -or $version -ne "1.14.5") {
            throw "打包后的 SVN CLI 无法运行或版本不正确: $version"
          }
          Write-Host "打包后的 SVN CLI: $version"

      - name: 生成校验值与测试说明
        shell: pwsh
        run: |
          $output = "release/issue-136-test"
          $installer = Get-ChildItem $output -Filter "*.exe" -Recurse | Where-Object { $_.DirectoryName -eq (Resolve-Path $output).Path } | Select-Object -First 1
          if (-not $installer) {
            throw "未找到 Windows 测试安装包"
          }
          $hash = Get-FileHash $installer.FullName -Algorithm SHA256
          "$($hash.Hash)  $($installer.Name)" | Set-Content "$($installer.FullName).sha256.txt" -Encoding utf8
          @(
            "用途: Issue #136 原地发布真实 Windows/TortoiseSVN/打包机验收"
            "测试版本: $env:TEST_VERSION"
            "源提交: $env:GITHUB_SHA"
            "源分支: $env:GITHUB_REF_NAME"
            "正式发布: 否"
            "正式客户端覆盖: 否，使用独立 appId 与应用数据目录"
            "内置 SVN CLI: Apache Subversion 1.14.5，仅用于本地工作副本操作"
            "远程提交: 公司已有 TortoiseSVN"
          ) | Set-Content "$output/BUILD-INFO.txt" -Encoding utf8
          @(
            "#136 测试版使用说明（.136.4）"
            ""
            "1. 保持老师正在使用的正式服务不变；让 Windows AI 从 feat/136-course-publish-flow 最新提交新建独立工作树，并在 6690 启动测试服务。"
            "2. 安装本测试版；它不会覆盖正式客户端。"
            "3. 将测试课件直接创建或另存到最终 SVN 课件目录，例如业务父目录 V9/S6 下的当前课件文件夹。"
            "4. 选择一个已经通过公司 TortoiseSVN checkout、并且覆盖该最终地址的本地 SVN 文件夹。"
            "5. 点击检查后应显示“原地发布”，并提示不会创建第二份课件；若显示“同步发布”，先核对业务父目录和当前课件位置。"
            "6. 准备发布后，课件 JSON、images、project、esBuild 与其他源文件必须保留；变更列表只包含 forge-publish.json 和实际 Game1_*。"
            "7. 点击“打开 TortoiseSVN 提交”，核对提交范围只包含身份文件和实际 Game1_*；源课件修改不得进入本次提交。"
            "8. 先取消一次，确认发布文件恢复而源课件不变；再次准备并完整提交后，应读取实际 revision、通知现有打包机并完成反馈。"
            "9. 另测一次课件位于最终目录之外的正常场景，确认仍显示“同步发布”并沿用原有复制发布流程。"
            "10. 源目录与最终目录互相包含但不完全相同时，必须明确阻止发布。"
          ) | Set-Content "$output/TEST-INSTRUCTIONS.txt" -Encoding utf8
          Write-Host "安装包: $($installer.FullName)"
          Write-Host "SHA-256: $($hash.Hash)"

      - name: 上传测试安装包
        uses: actions/upload-artifact@v4
        with:
          name: forge-issue-136-windows-test-4
          path: |
            release/issue-136-test/*.exe
            release/issue-136-test/*.sha256.txt
            release/issue-136-test/BUILD-INFO.txt
            release/issue-136-test/TEST-INSTRUCTIONS.txt
          if-no-files-found: error
          retention-days: 30
