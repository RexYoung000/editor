<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>阶段一 MVP · 三套内部界面管理方案</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #17212f;
      background: #e8eef2;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 1040px; overflow: hidden; }
    button { font: inherit; }
    .shell { height: 100vh; display: grid; grid-template-rows: auto 1fr; }
    .compare-bar {
      display: grid;
      grid-template-columns: minmax(260px, 0.8fr) minmax(560px, 1.6fr) auto;
      align-items: center;
      gap: 18px;
      padding: 12px 16px;
      border-bottom: 1px solid #cbd5df;
      background: #f8fafb;
      box-shadow: 0 4px 16px rgba(31, 42, 55, 0.07);
      z-index: 2;
    }
    h1 { margin: 0 0 3px; font-size: 17px; }
    .subtitle { color: #697789; font-size: 12px; line-height: 1.45; }
    .switcher { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .scheme {
      min-height: 48px;
      padding: 7px 10px;
      border: 1px solid #cbd5df;
      border-radius: 8px;
      background: #fff;
      color: #455468;
      text-align: left;
      cursor: pointer;
    }
    .scheme strong { display: block; margin-bottom: 2px; color: #243244; font-size: 13px; }
    .scheme span { font-size: 11px; line-height: 1.35; }
    .scheme.active { border-color: #177f78; background: #edf8f6; box-shadow: inset 0 0 0 1px #177f78; }
    .scheme.active strong { color: #11665f; }
    .bar-actions { display: flex; align-items: center; gap: 8px; }
    .bar-button {
      min-height: 34px;
      padding: 7px 11px;
      border: 1px solid #cbd5df;
      border-radius: 7px;
      background: #fff;
      color: #405064;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }
    .bar-button:hover { border-color: #9dabb9; background: #f3f6f8; }
    .frame-wrap { min-height: 0; background: #dfe7ec; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #eef3f6; }
    .about {
      position: fixed;
      top: 80px;
      right: 16px;
      width: min(420px, calc(100vw - 32px));
      padding: 16px;
      border: 1px solid #cbd5df;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 18px 60px rgba(22, 31, 43, 0.2);
      z-index: 10;
    }
    .about[hidden] { display: none; }
    .about h2 { margin: 0 0 10px; font-size: 16px; }
    .about p, .about li { color: #59687a; font-size: 12px; line-height: 1.65; }
    .about ul { margin: 8px 0 0; padding-left: 18px; }
    .about-close { float: right; border: 0; background: transparent; color: #657386; cursor: pointer; }
    @media (max-width: 1200px) {
      .compare-bar { grid-template-columns: 230px minmax(520px, 1fr) auto; gap: 10px; }
      .scheme span { display: none; }
      .scheme { min-height: 38px; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="compare-bar">
      <div>
        <h1>阶段一 MVP · 三套平等方案</h1>
        <div class="subtitle">相同课件、相同能力，比较三种内部界面管理方式。</div>
      </div>
      <nav class="switcher" aria-label="原型方案切换">
        <button class="scheme active" data-scheme="inline" type="button">
          <strong>方案一 · 内嵌精简</strong><span>在小关卡下直接管理</span>
        </button>
        <button class="scheme" data-scheme="drawer" type="button">
          <strong>方案二 · 侧边抽屉</strong><span>增加内部界面专用空间</span>
        </button>
        <button class="scheme" data-scheme="focus" type="button">
          <strong>方案三 · 专注工作区</strong><span>进入当前小关卡独立编辑</span>
        </button>
      </nav>
      <div class="bar-actions">
        <button id="aboutButton" class="bar-button" type="button">对比说明</button>
        <button id="resetAllButton" class="bar-button" type="button">全部重置</button>
      </div>
    </header>
    <main class="frame-wrap">
      <iframe id="prototypeFrame" title="阶段一内部界面管理原型" src="./phase-1-prototypes/inline.html"></iframe>
    </main>
  </div>

  <aside id="aboutPanel" class="about" hidden>
    <button id="aboutClose" class="about-close" type="button" aria-label="关闭">×</button>
    <h2>如何体验三套方案</h2>
    <p>三套方案地位完全平等，各自保存独立进度。建议分别体验创建、复制到下方、跨关卡拖拽、弹窗换底板、按钮事件跳转和撤销。</p>
    <ul>
      <li>方案一验证：保留现有结构、充分做减法是否已经足够。</li>
      <li>方案二验证：增加专用管理抽屉是否更平衡。</li>
      <li>方案三验证：复杂课件是否需要独立专注环境。</li>
    </ul>
  </aside>

  <script>
    const paths = {
      inline: './phase-1-prototypes/inline.html',
      drawer: './phase-1-prototypes/drawer.html',
      focus: './phase-1-prototypes/focus.html',
    };
    const frame = document.getElementById('prototypeFrame');
    const buttons = [...document.querySelectorAll('[data-scheme]')];
    const about = document.getElementById('aboutPanel');

    function switchScheme(scheme) {
      buttons.forEach((button) => button.classList.toggle('active', button.dataset.scheme === scheme));
      frame.src = paths[scheme];
      history.replaceState(null, '', `#${scheme}`);
    }

    buttons.forEach((button) => button.addEventListener('click', () => switchScheme(button.dataset.scheme)));
    document.getElementById('aboutButton').addEventListener('click', () => { about.hidden = !about.hidden; });
    document.getElementById('aboutClose').addEventListener('click', () => { about.hidden = true; });
    document.getElementById('resetAllButton').addEventListener('click', () => {
      ['inline', 'drawer', 'focus'].forEach((scheme) => {
        localStorage.removeItem(`forge-phase1-${scheme}`);
        localStorage.removeItem(`forge-phase1-layout-${scheme}`);
      });
      frame.contentWindow?.postMessage({ type: 'forge-phase1-reset' }, '*');
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') about.hidden = true;
    });

    const initial = location.hash.slice(1);
    if (paths[initial]) switchScheme(initial);
  </script>
</body>
</html>
